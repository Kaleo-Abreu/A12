<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Início{% endblock %} - Sistema Acadêmico</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

    <!-- Cabeçalho e Navegação -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between py-3 sm:py-0 sm:h-16 gap-3 sm:gap-0">
                <!-- Título do Sistema -->
                <div class="flex items-center justify-center sm:justify-start">
                    <a href="/" class="text-lg font-semibold text-slate-900 hover:text-blue-600 transition-colors">
                        Sistema Acadêmico
                    </a>
                </div>

                <!-- Menu de Navegação -->
                <nav class="flex items-center justify-center space-x-1 sm:space-x-2 text-sm font-medium">
                    <a href="/" class="px-3 py-2 rounded-md text-slate-600 hover:text-blue-600 hover:bg-slate-100 transition-colors">
                        Início
                    </a>
                    <a href="/departamentos" class="px-3 py-2 rounded-md text-slate-600 hover:text-blue-600 hover:bg-slate-100 transition-colors">
                        Departamentos
                    </a>
                    <a href="{{ url_for('professores') }}" class="px-3 py-2 rounded-md text-slate-600 hover:text-blue-600 hover:bg-slate-100 transition-colors">
                        Professores
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-slate-500">
            <p>Sistema Acadêmico</p>
        </div>
    </footer>

</body>
</html>
