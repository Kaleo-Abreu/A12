{% extends "base.html" %}

{% block title %}Cadastro de Departamento{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto">

    <div class="mb-6">
        <h1 class="text-2xl font-bold text-slate-900">
            Cadastrar Departamento
        </h1>

        <p class="text-sm text-slate-600 mt-1">
            Preencha os campos abaixo para cadastrar um novo departamento.
        </p>
    </div>

    <div class="bg-white border border-slate-200 rounded-lg shadow-sm p-6">

        <form action="/departamentos/cadastrar" method="POST" class="space-y-5">

            <div>
                <label for="numero" class="block text-sm font-medium text-slate-700 mb-1">
                    Número do Departamento
                </label>

                <input
                    type="number"
                    id="numero"
                    name="numero"
                    class="w-full border border-slate-300 rounded-md px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Digite o número do departamento"
                >
            </div>

            <div>
                <label for="descricao" class="block text-sm font-medium text-slate-700 mb-1">
                    Descrição
                </label>

                <input
                    type="text"
                    id="descricao"
                    name="descricao"
                    class="w-full border border-slate-300 rounded-md px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Digite a descrição do departamento"
                >
            </div>

            <div class="flex items-center justify-between pt-2">

                <a href="/"
                   class="text-sm text-slate-600 hover:text-slate-900">
                    Cancelar
                </a>

                <button
                    type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-md text-sm font-medium transition-colors">
                    Cadastrar
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
